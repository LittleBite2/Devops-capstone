apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: littlebite2/react-k8s-app:latest
          ports:
            - containerPort: 80

          # ✅ FIXED POSITION
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: password

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"