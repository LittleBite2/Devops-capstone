name: Full DevOps Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: littlebite2/react-k8s-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout
    - name: Checkout code
      uses: actions/checkout@v3

    # ------------------------
    # 🏗️ Terraform (Infra)
    # ------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: |
        cd infra
        terraform init

    - name: Terraform Apply
      run: |
        cd infra
        terraform apply -auto-approve

    # ------------------------
    # ⚛️ React App
    # ------------------------
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd react-k8s-app
        npm install

    - name: Run tests
      run: |
        cd react-k8s-app
        npm test -- --watchAll=false

    - name: Build app
      run: |
        cd react-k8s-app
        npm run build

    # ------------------------
    # 🐳 Docker
    # ------------------------
    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Image
      run: |
        cd react-k8s-app
        docker build -t $IMAGE_NAME:latest .

    - name: Push Image
      run: docker push $IMAGE_NAME:latest

    # ------------------------
    # ☸️ Kubernetes Deploy
    # ------------------------
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure kubeconfig
      run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig

    - name: Deploy
      run: |
        export KUBECONFIG=kubeconfig
        kubectl apply -f react-k8s-app/deployment.yaml
        kubectl apply -f react-k8s-app/service.yaml
        